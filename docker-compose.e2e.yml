services:
  bitrix:
    build:
      context: .
      dockerfile: docker/Dockerfile.e2e
    ports:
      - "8088:80"
    depends_on:
      mysql:
        condition: service_healthy
    tty: true

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sitemanager
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - bitrix_mysql_data:/var/lib/mysql

  wizard:
    build:
      context: .
      dockerfile: tests/feature/Dockerfile
    environment:
      BITRIX_URL: http://bitrix
      DB_HOST: mysql
    depends_on:
      - bitrix
    profiles:
      - tools

volumes:
  bitrix_mysql_data:
